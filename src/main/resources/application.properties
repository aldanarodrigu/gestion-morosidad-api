spring.application.name=gestion-morosidad-api

spring.config.import=optional:file:.env[.properties]

# Base de datos
# Los valores pueden venir por variables de entorno.
# Los defaults permiten correr Spring localmente contra PostgreSQL de Docker.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:morosidad}?sslmode=${DB_SSLMODE:prefer}&reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:morosidad}
spring.datasource.password=${DB_PASSWORD:}
# Supabase (plan gratuito) admite 15 conexiones en total entre todos los que usan la base.
# Con el default de Hikari (10 por instancia) dos personas con la API levantada la llenan.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Envía INSERT/UPDATE en lotes (la sincronización actualiza miles de filas por corrida)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# API GeoPagos
geopagos.base-url=${GEOPAGOS_BASE_URL:https://servicios.sanjose.gub.uy/utec_geopagos_service}
geopagos.username=${UTEC_API_USERNAME:}
geopagos.password=${UTEC_API_PASSWORD:}
geopagos.connect-timeout=${GEOPAGOS_CONNECT_TIMEOUT:10s}
geopagos.read-timeout=${GEOPAGOS_READ_TIMEOUT:180s}
geopagos.page-size=${UTEC_API_PAGE_SIZE:1000}

# Sincronización con GeoPagos (manual: POST /api/sincronizaciones/deudas)
sincronizacion.automatica.habilitada=${SINCRONIZACION_AUTOMATICA:true}
sincronizacion.automatica.cron=${SINCRONIZACION_CRON:0 0 3 * * *}
sincronizacion.cierre-mensual.cron=${SINCRONIZACION_CIERRE_MENSUAL_CRON:0 0 22 L * *}
sincronizacion.dias-cobros-iniciales=90

# Paginación: evitar páginas gigantes (?size=100000)
spring.data.web.pageable.max-page-size=100

# JWT
jwt.secret=${JWT_SECRET}
# Duración del token en segundos (por defecto 1 hora).
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Fallos permitidos por cuenta desde una misma IP, por IP contra cualquier cuenta y por cuenta desde todas las IP.
auth.login.max-fallos=${LOGIN_MAX_FALLOS:5}
auth.login.max-fallos-ip=${LOGIN_MAX_FALLOS_IP:20}
auth.login.max-fallos-cuenta=${LOGIN_MAX_FALLOS_CUENTA:50}
auth.login.ventana-segundos=${LOGIN_VENTANA_SEGUNDOS:900}
auth.login.bloqueo-segundos=${LOGIN_BLOQUEO_SEGUNDOS:900}

# IP del cliente detrás del nginx del frontend: se toma de X-Real-IP, que nginx sobrescribe con la
# dirección real (un cliente no puede inyectarla a través del proxy). Tomcat solo acepta el header si la
# conexión viene de un proxy de confianza: por defecto redes privadas y localhost. Si la API queda
# expuesta sin proxy en una red privada, restringirlo con SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (regex).
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Real-IP
