spring.application.name=gestion-morosidad-api

spring.config.import=optional:file:.env[.properties]

# Base de datos
# Los valores pueden venir por variables de entorno.
# Los defaults permiten correr Spring localmente contra PostgreSQL de Docker.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:morosidad}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:morosidad}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Envía INSERT/UPDATE en lotes (la sincronización actualiza miles de filas por corrida)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# API GeoPagos
geopagos.base-url=${GEOPAGOS_BASE_URL:https://servicios.sanjose.gub.uy/utec_geopagos_service}
geopagos.username=${UTEC_API_USERNAME:}
geopagos.password=${UTEC_API_PASSWORD:}
geopagos.connect-timeout=${GEOPAGOS_CONNECT_TIMEOUT:10s}
geopagos.read-timeout=${GEOPAGOS_READ_TIMEOUT:180s}

# Sincronización con GeoPagos (manual: POST /api/sincronizaciones/deudas)
sincronizacion.automatica.habilitada=${SINCRONIZACION_AUTOMATICA:false}
sincronizacion.automatica.cron=${SINCRONIZACION_CRON:0 0 3 * * *}
sincronizacion.dias-cobros-iniciales=90


# Paginación: evitar páginas gigantes (?size=100000)
spring.data.web.pageable.max-page-size=100
