spring.application.name=gestion-morosidad-api

# Base de datos: valores por variable de entorno (los defaults sirven para correr local contra el Postgres del compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:morosidad}
spring.datasource.username=${DB_USER:morosidad}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false

# API GeoPagos (Intendencia): credenciales solo por entorno, nunca en el código
geopagos.base-url=${GEOPAGOS_BASE_URL:https://servicios.sanjose.gub.uy/utec_geopagos_service}
geopagos.username=${UTEC_API_USERNAME:}
geopagos.password=${UTEC_API_PASSWORD:}
